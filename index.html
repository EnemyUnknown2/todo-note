<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>할 일 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #eef2f1;
  --surface: #ffffff;
  --surface-2: #f5f8f7;
  --ink: #17231f;
  --ink-2: #4c5c57;
  --ink-3: #82918c;
  --line: #d7e0dd;
  --accent: #1f6f5c;
  --accent-ink: #ffffff;
  --accent-soft: #dcefe8;
  --high: #c2412d;
  --high-soft: #fbe4df;
  --normal: #9a6b00;
  --normal-soft: #f8edcf;
  --low: #52708a;
  --low-soft: #e2ebf3;
  --shadow: 0 1px 2px rgba(20, 40, 34, .06), 0 8px 24px rgba(20, 40, 34, .06);
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f1614;
    --surface: #17211e;
    --surface-2: #1d2925;
    --ink: #e4ece9;
    --ink-2: #a9b8b3;
    --ink-3: #72827c;
    --line: #2a3833;
    --accent: #5cc3a5;
    --accent-ink: #0b1a15;
    --accent-soft: #1d3a31;
    --high: #f08a76;
    --high-soft: #3d221c;
    --normal: #e2b64d;
    --normal-soft: #37301a;
    --low: #93b4d1;
    --low-soft: #1f2c38;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1614;
  --surface: #17211e;
  --surface-2: #1d2925;
  --ink: #e4ece9;
  --ink-2: #a9b8b3;
  --ink-3: #72827c;
  --line: #2a3833;
  --accent: #5cc3a5;
  --accent-ink: #0b1a15;
  --accent-soft: #1d3a31;
  --high: #f08a76;
  --high-soft: #3d221c;
  --normal: #e2b64d;
  --normal-soft: #37301a;
  --low: #93b4d1;
  --low-soft: #1f2c38;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  padding: 0 16px;
  padding-block: 40px 64px;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 20px; }

header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.today { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
h1 { margin: 2px 0 0; font-size: 28px; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
.progress { display: grid; gap: 6px; min-width: 150px; justify-items: end; }
.progress-label { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.progress-label b { color: var(--ink); font-weight: 600; }
.bar { width: 150px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar > span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }

/* 입력 */
.composer {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
  padding: 12px;
  display: grid;
  gap: 10px;
}
.composer-row { display: flex; gap: 8px; }
#new-text {
  flex: 1; min-width: 0;
  border: 0; background: transparent;
  padding: 8px 6px; font-size: 16px;
}
#new-text:focus { outline: none; }
#new-text::placeholder { color: var(--ink-3); }
.btn-add {
  border: 0; border-radius: 10px;
  background: var(--accent); color: var(--accent-ink);
  padding: 0 18px; font-weight: 600; white-space: nowrap;
}
.btn-add:disabled { opacity: .45; cursor: default; }
.composer-opts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-top: 1px solid var(--line); padding-top: 10px; }
.field { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }
.field input[type="date"] {
  border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2);
  padding: 4px 8px; font-family: var(--mono); font-size: 13px;
}
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button {
  border: 0; background: var(--surface-2); padding: 4px 10px; font-size: 13px; color: var(--ink-2);
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"][data-p="high"] { background: var(--high-soft); color: var(--high); font-weight: 600; }
.seg button[aria-pressed="true"][data-p="normal"] { background: var(--normal-soft); color: var(--normal); font-weight: 600; }
.seg button[aria-pressed="true"][data-p="low"] { background: var(--low-soft); color: var(--low); font-weight: 600; }

/* 툴바 */
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.tabs { display: inline-flex; gap: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.tabs button {
  border: 0; background: transparent; border-radius: 7px; padding: 5px 12px; font-size: 13px; color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.tabs .n { color: var(--ink-3); margin-left: 4px; font-weight: 400; }
.sort { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }
.sort select {
  border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 4px 8px; font-size: 13px;
}

/* 목록 */
.list-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
}
ul#list { list-style: none; margin: 0; padding: 0; }
.item {
  display: grid;
  grid-template-columns: auto auto 1fr auto;
  align-items: center;
  gap: 10px;
  padding: 12px 12px 12px 6px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.item:last-child { border-bottom: 0; }
.item.dragging { background: var(--accent-soft); box-shadow: var(--shadow); position: relative; z-index: 2; }
.handle {
  width: 22px; height: 30px; display: grid; place-items: center;
  color: var(--ink-3); cursor: grab; touch-action: none; border: 0; background: transparent; padding: 0; border-radius: 6px;
}
.handle:hover { color: var(--ink-2); background: var(--surface-2); }
.handle[disabled] { visibility: hidden; }
.dragging .handle { cursor: grabbing; }
.check {
  appearance: none; margin: 0;
  width: 22px; height: 22px; border-radius: 50%;
  border: 2px solid var(--ink-3); background: var(--surface);
  display: grid; place-items: center; cursor: pointer;
  transition: background .15s, border-color .15s;
}
.check::after {
  content: ""; width: 10px; height: 6px;
  border-left: 2px solid var(--accent-ink); border-bottom: 2px solid var(--accent-ink);
  transform: rotate(-45deg) translate(1px, -1px); opacity: 0;
}
.check:checked { background: var(--accent); border-color: var(--accent); }
.check:checked::after { opacity: 1; }
.body { min-width: 0; display: grid; gap: 4px; }
.text { overflow-wrap: anywhere; cursor: text; }
.done .text { color: var(--ink-3); text-decoration: line-through; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.meta:empty { display: none; }
.pill {
  font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 1px 8px; line-height: 1.6;
}
.pill.high { background: var(--high-soft); color: var(--high); }
.pill.normal { background: var(--normal-soft); color: var(--normal); }
.pill.low { background: var(--low-soft); color: var(--low); }
.due { font-family: var(--mono); font-size: 12px; color: var(--ink-2); display: inline-flex; gap: 4px; align-items: center; }
.due.overdue { color: var(--high); font-weight: 500; }
.due.soon { color: var(--normal); }
.done .pill, .done .due { opacity: .55; }
.actions { display: flex; gap: 2px; opacity: .55; transition: opacity .15s; }
.item:hover .actions, .item:focus-within .actions { opacity: 1; }
.icon-btn {
  width: 32px; height: 32px; display: grid; place-items: center;
  border: 0; background: transparent; border-radius: 8px; color: var(--ink-2);
}
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn.del:hover { background: var(--high-soft); color: var(--high); }

.edit-form { display: grid; gap: 8px; }
.edit-form input[type="text"] {
  width: 100%; border: 1px solid var(--accent); border-radius: 8px; padding: 6px 8px; background: var(--surface-2);
}
.edit-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.edit-row .spacer { flex: 1; }
.btn-sm { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 12px; font-size: 13px; }
.btn-sm.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }

.empty { padding: 40px 20px; text-align: center; color: var(--ink-3); }
.empty strong { display: block; color: var(--ink-2); font-weight: 600; margin-bottom: 4px; }

.list-foot {
  display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 14px; border-top: 1px solid var(--line); background: var(--surface-2);
  font-size: 13px; color: var(--ink-2);
}
.list-foot[hidden] { display: none; }
.link-btn { border: 0; background: transparent; color: var(--ink-2); padding: 2px 4px; border-radius: 6px; font-size: 13px; }
.link-btn:hover { color: var(--high); }
.link-btn:disabled { opacity: .4; cursor: default; color: var(--ink-3); }
.confirm { display: inline-flex; gap: 6px; align-items: center; }

.hint { font-size: 12px; color: var(--ink-3); text-align: center; }
.status { font-size: 12px; color: var(--ink-3); text-align: center; }
.status.warn { color: var(--high); }

@media (max-width: 480px) {
  body { padding-block: 24px 48px; }
  h1 { font-size: 24px; }
  .progress { justify-items: start; }
  .actions { opacity: 1; }
  .icon-btn { width: 30px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="today" id="today"></div>
      <h1>할 일 노트</h1>
    </div>
    <div class="progress" aria-live="polite">
      <div class="progress-label" id="progress-label"></div>
      <div class="bar"><span id="progress-bar"></span></div>
    </div>
  </header>

  <form class="composer" id="composer" autocomplete="off">
    <div class="composer-row">
      <input id="new-text" type="text" placeholder="할 일을 입력하고 Enter" maxlength="300" aria-label="새 할 일">
      <button class="btn-add" id="add-btn" type="submit" disabled>추가</button>
    </div>
    <div class="composer-opts">
      <label class="field" for="new-due">마감
        <input id="new-due" type="date">
      </label>
      <span class="field">중요도
        <span class="seg" id="new-priority" role="group" aria-label="중요도">
          <button type="button" data-p="high" aria-pressed="false">높음</button>
          <button type="button" data-p="normal" aria-pressed="true">보통</button>
          <button type="button" data-p="low" aria-pressed="false">낮음</button>
        </span>
      </span>
    </div>
  </form>

  <div class="toolbar">
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-f="all" aria-selected="true">전체<span class="n" id="n-all">0</span></button>
      <button role="tab" data-f="active" aria-selected="false">진행 중<span class="n" id="n-active">0</span></button>
      <button role="tab" data-f="done" aria-selected="false">완료<span class="n" id="n-done">0</span></button>
    </div>
    <label class="sort" for="sort">정렬
      <select id="sort">
        <option value="manual">직접 정렬</option>
        <option value="due">마감일순</option>
        <option value="priority">중요도순</option>
      </select>
    </label>
  </div>

  <div class="list-card">
    <ul id="list"></ul>
    <div class="empty" id="empty" hidden></div>
    <div class="list-foot" id="foot">
      <span id="foot-left"></span>
      <span id="clear-wrap">
        <button class="link-btn" id="clear-done" type="button">완료 항목 삭제</button>
      </span>
    </div>
  </div>

  <div class="hint" id="hint">텍스트를 더블클릭하면 수정, 왼쪽 손잡이를 끌면 순서가 바뀝니다.</div>
  <div class="status" id="status">불러오는 중…</div>
</div>

<script>
(function () {
  "use strict";

  var ICON = {
    grip: '<svg width="12" height="18" viewBox="0 0 12 18" aria-hidden="true"><g fill="currentColor"><circle cx="3" cy="3" r="1.5"/><circle cx="9" cy="3" r="1.5"/><circle cx="3" cy="9" r="1.5"/><circle cx="9" cy="9" r="1.5"/><circle cx="3" cy="15" r="1.5"/><circle cx="9" cy="15" r="1.5"/></g></svg>',
    edit: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M11.3 2.3a1.5 1.5 0 0 1 2.1 0l.3.3a1.5 1.5 0 0 1 0 2.1L6 12.4 2.5 13.5 3.6 10z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>',
    del: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };
  var P_LABEL = { high: "높음", normal: "보통", low: "낮음" };
  var P_RANK = { high: 0, normal: 1, low: 2 };
  var LOCAL_KEY = "todo-note-items";
  var PREF_KEY = "todo-note-prefs";

  var $ = function (id) { return document.getElementById(id); };
  var listEl = $("list");

  var state = {
    todos: [],
    filter: "all",
    sort: "manual",
    newPriority: "normal",
    editingId: null,
    confirmClear: false,
    loaded: false
  };
  var dragging = null;
  var pendingRender = false;

  // ---------- 날짜 ----------
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function isoDate(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function todayIso() { return isoDate(new Date()); }
  function dayDiff(iso) {
    var p = iso.split("-").map(Number);
    var a = new Date(p[0], p[1] - 1, p[2]);
    var t = new Date(); t.setHours(0, 0, 0, 0);
    return Math.round((a - t) / 86400000);
  }
  function dueLabel(iso) {
    var d = dayDiff(iso);
    var p = iso.split("-").map(Number);
    var md = p[1] + "월 " + p[2] + "일";
    if (d === 0) return "오늘";
    if (d === 1) return "내일";
    if (d < 0) return md + " · " + (-d) + "일 지남";
    if (d <= 7) return md + " · D-" + d;
    return (p[0] !== new Date().getFullYear() ? p[0] + "년 " : "") + md;
  }
  (function () {
    var d = new Date();
    var wd = ["일", "월", "화", "수", "목", "금", "토"][d.getDay()];
    $("today").textContent = d.getFullYear() + "." + pad(d.getMonth() + 1) + "." + pad(d.getDate()) + " (" + wd + ")";
  })();

  // ---------- 설정(뷰어별) ----------
  try {
    var prefs = JSON.parse(localStorage.getItem(PREF_KEY) || "{}");
    if (prefs.filter) state.filter = prefs.filter;
    if (prefs.sort) state.sort = prefs.sort;
  } catch (e) {}
  function savePrefs() {
    try { localStorage.setItem(PREF_KEY, JSON.stringify({ filter: state.filter, sort: state.sort })); } catch (e) {}
  }

  // ---------- 저장소 ----------
  // db 가 있으면 계정 저장소(기기 간 동기화), 없으면 이 브라우저에만 저장.
  var store = null;

  function localStore() {
    function persist() {
      try { localStorage.setItem(LOCAL_KEY, JSON.stringify(state.todos)); } catch (e) {}
    }
    try { state.todos = JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]"); } catch (e) { state.todos = []; }
    return {
      mode: "local",
      add: function (t) { t.id = "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); state.todos.push(t); persist(); render(); return Promise.resolve(); },
      update: function (id, patch) { var t = find(id); if (t) Object.assign(t, patch); persist(); render(); return Promise.resolve(); },
      remove: function (id) { state.todos = state.todos.filter(function (t) { return t.id !== id; }); persist(); render(); return Promise.resolve(); }
    };
  }

  function dbStore(db) {
    var col = db.collection("todos");
    function fail(e) {
      var code = e && e.code;
      var msg = "저장하지 못했습니다. 잠시 후 다시 시도해 주세요.";
      if (code === "quota_exceeded") msg = "저장 공간이 가득 찼습니다. 완료 항목을 삭제한 뒤 다시 추가해 주세요.";
      if (code === "invalid_argument") msg = "이 페이지에서 수정할 권한이 없습니다.";
      setStatus(msg, true);
    }
    col.onSnapshot(function (snap) {
      state.todos = snap.docs.map(function (d) { var o = Object.assign({}, d.data()); o.id = d.id; return o; });
      state.loaded = true;
      setStatus("계정에 저장됨 · 다른 기기에서도 보입니다");
      render();
    }, function () {
      setStatus("연결이 끊겼습니다. 새로고침해 주세요.", true);
    });
    return {
      mode: "db",
      add: function (t) { return col.add(t).catch(fail); },
      update: function (id, patch) { return col.doc(id).update(patch).catch(fail); },
      remove: function (id) { return col.doc(id).delete().catch(fail); }
    };
  }

  function setStatus(msg, warn) {
    var s = $("status");
    s.textContent = msg;
    s.classList.toggle("warn", !!warn);
  }

  function find(id) {
    for (var i = 0; i < state.todos.length; i++) if (state.todos[i].id === id) return state.todos[i];
    return null;
  }

  // ---------- 정렬·필터 ----------
  function byOrder(a, b) { return (a.order || 0) - (b.order || 0); }
  function sorted() {
    var arr = state.todos.slice();
    if (state.sort === "manual") return arr.sort(byOrder);
    return arr.sort(function (a, b) {
      if (!!a.done !== !!b.done) return a.done ? 1 : -1;
      if (state.sort === "due") {
        if (a.due !== b.due) {
          if (!a.due) return 1;
          if (!b.due) return -1;
          return a.due < b.due ? -1 : 1;
        }
        return (P_RANK[a.priority] - P_RANK[b.priority]) || byOrder(a, b);
      }
      var pr = P_RANK[a.priority] - P_RANK[b.priority];
      if (pr) return pr;
      if (a.due !== b.due) {
        if (!a.due) return 1;
        if (!b.due) return -1;
        return a.due < b.due ? -1 : 1;
      }
      return byOrder(a, b);
    });
  }
  function visible() {
    return sorted().filter(function (t) {
      if (state.filter === "active") return !t.done;
      if (state.filter === "done") return !!t.done;
      return true;
    });
  }

  // ---------- 렌더 ----------
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function render() {
    if (dragging || state.editingId && find(state.editingId)) { pendingRender = true; return; }
    pendingRender = false;
    state.editingId = null;

    var total = state.todos.length;
    var doneN = state.todos.filter(function (t) { return t.done; }).length;
    var activeN = total - doneN;
    $("n-all").textContent = total;
    $("n-active").textContent = activeN;
    $("n-done").textContent = doneN;
    $("progress-label").innerHTML = total ? "<b>" + doneN + "</b> / " + total + " 완료" : "아직 할 일이 없어요";
    $("progress-bar").style.width = total ? (doneN / total * 100) + "%" : "0";

    Array.prototype.forEach.call($("tabs").children, function (b) {
      b.setAttribute("aria-selected", String(b.dataset.f === state.filter));
    });
    $("sort").value = state.sort;
    $("hint").hidden = state.sort !== "manual" || total === 0;

    var items = visible();
    listEl.textContent = "";
    items.forEach(function (t) { listEl.appendChild(renderItem(t)); });

    var empty = $("empty");
    empty.hidden = items.length > 0 || !state.loaded;
    if (!items.length) {
      var msg = total === 0
        ? ["할 일이 비어 있어요", "위 입력창에 첫 할 일을 적어 보세요."]
        : state.filter === "active"
          ? ["모두 끝냈어요", "진행 중인 할 일이 없습니다."]
          : ["완료한 항목이 없어요", "체크한 할 일이 여기에 모입니다."];
      empty.innerHTML = "";
      empty.appendChild(el("strong", null, msg[0]));
      empty.appendChild(document.createTextNode(msg[1]));
    }

    $("foot").hidden = total === 0;
    $("foot-left").textContent = activeN ? "남은 할 일 " + activeN + "개" : "모두 완료했어요";
    renderClear(doneN);
  }

  function renderClear(doneN) {
    var wrap = $("clear-wrap");
    wrap.textContent = "";
    if (state.confirmClear && doneN) {
      var c = el("span", "confirm");
      c.appendChild(el("span", null, "완료 " + doneN + "개를 삭제할까요?"));
      var yes = el("button", "btn-sm primary", "삭제");
      yes.type = "button";
      yes.onclick = function () {
        state.confirmClear = false;
        state.todos.filter(function (t) { return t.done; }).forEach(function (t) { store.remove(t.id); });
        render();
      };
      var no = el("button", "btn-sm", "취소");
      no.type = "button";
      no.onclick = function () { state.confirmClear = false; render(); };
      c.appendChild(yes); c.appendChild(no);
      wrap.appendChild(c);
    } else {
      state.confirmClear = false;
      var b = el("button", "link-btn", "완료 항목 삭제");
      b.type = "button";
      b.disabled = !doneN;
      b.onclick = function () { state.confirmClear = true; render(); };
      wrap.appendChild(b);
    }
  }

  function renderItem(t) {
    var li = el("li", "item" + (t.done ? " done" : ""));
    li.dataset.id = t.id;

    var handle = el("button", "handle");
    handle.type = "button";
    handle.innerHTML = ICON.grip;
    handle.setAttribute("aria-label", "순서 이동 (위/아래 화살표)");
    handle.disabled = state.sort !== "manual";
    handle.addEventListener("pointerdown", function (e) { startDrag(e, li); });
    handle.addEventListener("keydown", function (e) {
      if (e.key === "ArrowUp" || e.key === "ArrowDown") { e.preventDefault(); moveBy(t.id, e.key === "ArrowUp" ? -1 : 1); }
    });

    var check = document.createElement("input");
    check.type = "checkbox";
    check.className = "check";
    check.checked = !!t.done;
    check.setAttribute("aria-label", t.done ? "완료 취소" : "완료로 표시");
    check.addEventListener("change", function () { store.update(t.id, { done: check.checked }); });

    var body = el("div", "body");
    var text = el("div", "text", t.text);
    text.addEventListener("dblclick", function () { startEdit(t.id); });
    body.appendChild(text);
    var meta = el("div", "meta");
    if (t.priority && t.priority !== "normal") meta.appendChild(el("span", "pill " + t.priority, "중요도 " + P_LABEL[t.priority]));
    if (t.due) {
      var d = dayDiff(t.due);
      var cls = "due";
      if (!t.done && d < 0) cls += " overdue";
      else if (!t.done && d <= 1) cls += " soon";
      var due = el("span", cls, dueLabel(t.due));
      due.title = t.due;
      meta.appendChild(due);
    }
    body.appendChild(meta);

    var actions = el("div", "actions");
    var eb = el("button", "icon-btn");
    eb.type = "button"; eb.innerHTML = ICON.edit; eb.setAttribute("aria-label", "수정"); eb.title = "수정";
    eb.onclick = function () { startEdit(t.id); };
    var db = el("button", "icon-btn del");
    db.type = "button"; db.innerHTML = ICON.del; db.setAttribute("aria-label", "삭제"); db.title = "삭제";
    db.onclick = function () { store.remove(t.id); };
    actions.appendChild(eb); actions.appendChild(db);

    li.appendChild(handle); li.appendChild(check); li.appendChild(body); li.appendChild(actions);
    return li;
  }

  // ---------- 편집 ----------
  function startEdit(id) {
    var t = find(id);
    if (!t || state.editingId) return;
    var li = listEl.querySelector('[data-id="' + id + '"]');
    if (!li) return;
    state.editingId = id;
    var body = li.querySelector(".body");
    var form = el("form", "edit-form");
    var input = document.createElement("input");
    input.type = "text"; input.id = "edit-text"; input.value = t.text; input.maxLength = 300;
    input.setAttribute("aria-label", "할 일 수정");
    var row = el("div", "edit-row");
    var dl = el("label", "field", "마감 ");
    var date = document.createElement("input");
    date.type = "date"; date.id = "edit-due"; date.value = t.due || "";
    dl.appendChild(date);
    var seg = el("span", "seg");
    var pr = t.priority || "normal";
    ["high", "normal", "low"].forEach(function (p) {
      var b = el("button", null, P_LABEL[p]);
      b.type = "button"; b.dataset.p = p; b.setAttribute("aria-pressed", String(p === pr));
      b.onclick = function () {
        pr = p;
        Array.prototype.forEach.call(seg.children, function (x) { x.setAttribute("aria-pressed", String(x.dataset.p === p)); });
      };
      seg.appendChild(b);
    });
    var save = el("button", "btn-sm primary", "저장"); save.type = "submit";
    var cancel = el("button", "btn-sm", "취소"); cancel.type = "button";
    row.appendChild(dl); row.appendChild(seg); row.appendChild(el("span", "spacer")); row.appendChild(cancel); row.appendChild(save);
    form.appendChild(input); form.appendChild(row);
    body.replaceWith(form);
    li.querySelector(".actions").hidden = true;
    input.focus(); input.select();

    function finish() { state.editingId = null; render(); }
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var v = input.value.trim();
      if (!v) { input.focus(); return; }
      var patch = {};
      if (v !== t.text) patch.text = v;
      if ((date.value || null) !== (t.due || null)) patch.due = date.value || null;
      if (pr !== (t.priority || "normal")) patch.priority = pr;
      state.editingId = null;
      if (Object.keys(patch).length) store.update(id, patch);
      render();
    });
    cancel.onclick = finish;
    form.addEventListener("keydown", function (e) { if (e.key === "Escape") { e.preventDefault(); finish(); } });
  }

  // ---------- 순서 변경 ----------
  // 옮긴 항목 하나의 order 만 이웃 사이 값으로 바꿔 한 번만 저장한다.
  function orderBetween(prev, next) {
    if (prev && next) return (prev.order + next.order) / 2;
    if (prev) return prev.order + 1024;
    if (next) return next.order - 1024;
    return Date.now();
  }
  function commitPosition(id, prevId, nextId) {
    var o = orderBetween(prevId && find(prevId), nextId && find(nextId));
    var t = find(id);
    if (t && t.order !== o) { t.order = o; store.update(id, { order: o }); }
  }
  function moveBy(id, dir) {
    var ids = visible().map(function (t) { return t.id; });
    var i = ids.indexOf(id), j = i + dir;
    if (j < 0 || j >= ids.length) return;
    ids.splice(i, 1); ids.splice(j, 0, id);
    commitPosition(id, ids[j - 1], ids[j + 1]);
    render();
    var h = listEl.querySelector('[data-id="' + id + '"] .handle');
    if (h) h.focus();
  }

  function startDrag(e, li) {
    if (state.sort !== "manual" || state.editingId) return;
    e.preventDefault();
    var handle = e.currentTarget;
    handle.setPointerCapture(e.pointerId);
    dragging = { li: li, startY: e.clientY, offset: 0 };
    li.classList.add("dragging");

    function onMove(ev) {
      var y = ev.clientY;
      var sib;
      // 위/아래 이웃의 중간선을 넘으면 DOM 에서 자리 교체
      while ((sib = li.previousElementSibling)) {
        var r = sib.getBoundingClientRect();
        if (y < r.top + r.height / 2) listEl.insertBefore(li, sib); else break;
      }
      while ((sib = li.nextElementSibling)) {
        var r2 = sib.getBoundingClientRect();
        if (y > r2.top + r2.height / 2) listEl.insertBefore(sib, li); else break;
      }
    }
    function onUp() {
      handle.removeEventListener("pointermove", onMove);
      handle.removeEventListener("pointerup", onUp);
      handle.removeEventListener("pointercancel", onUp);
      li.classList.remove("dragging");
      var prev = li.previousElementSibling, next = li.nextElementSibling;
      dragging = null;
      commitPosition(li.dataset.id, prev && prev.dataset.id, next && next.dataset.id);
      render();
    }
    handle.addEventListener("pointermove", onMove);
    handle.addEventListener("pointerup", onUp);
    handle.addEventListener("pointercancel", onUp);
  }

  // ---------- 입력 ----------
  var newText = $("new-text");
  newText.addEventListener("input", function () { $("add-btn").disabled = !newText.value.trim() || !store; });
  $("new-priority").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    state.newPriority = b.dataset.p;
    Array.prototype.forEach.call(this.children, function (x) { x.setAttribute("aria-pressed", String(x === b)); });
  });
  $("composer").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = newText.value.trim();
    if (!v || !store) return;
    var maxO = state.todos.reduce(function (m, t) { return Math.max(m, t.order || 0); }, 0);
    store.add({
      text: v,
      done: false,
      due: $("new-due").value || null,
      priority: state.newPriority,
      order: maxO + 1024,
      createdAt: new Date().toISOString()
    });
    newText.value = "";
    $("new-due").value = "";
    $("add-btn").disabled = true;
    if (state.filter === "done") { state.filter = "all"; savePrefs(); render(); }
    newText.focus();
  });
  $("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    state.filter = b.dataset.f; state.confirmClear = false; savePrefs(); render();
  });
  $("sort").addEventListener("change", function () { state.sort = this.value; savePrefs(); render(); });

  // ---------- 시작 ----------
  render();
  var useLocal = function () {
    if (store) return;
    store = localStore();
    state.loaded = true;
    setStatus("이 브라우저에만 저장됩니다");
    $("add-btn").disabled = !newText.value.trim();
    render();
  };
  var claude = window.claude;
  if (claude && typeof claude.use === "function") {
    claude.use("db").then(function (db) {
      if (!db) return useLocal();
      store = dbStore(db);
      $("add-btn").disabled = !newText.value.trim();
    }, useLocal);
  } else {
    useLocal();
  }
})();
</script>
</body>
</html>
